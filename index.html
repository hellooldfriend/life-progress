<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Doozy — planning from a day to a year</title>
  <meta name="description" content="Personal and work planning across horizons: day, week, month, quarter, year. Tasks and reviews. Local, no backend." />
  <link rel="stylesheet" href="css/styles.css?v=2026-09-06" />
  <script>
    // Ловушка ошибок старта. Стоит до всех скриптов и не зависит от них:
    // если что-то упадёт при загрузке, страница скажет об этом, а не останется пустой.
    window.addEventListener('error', function (e) {
      var box = document.getElementById('bootError');
      if (!box) return;
      var where = (e.filename || '').split('/').pop();
      box.hidden = false;
      box.textContent = 'Doozy failed to start / Doozy не запустился: ' + (e.message || e.error || 'unknown error') +
        (where ? ' — ' + where + ':' + e.lineno + ':' + e.colno : '');
    });
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%238b5cf6'/><path d='M8 16.5l5 5 11-11' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>

<header class="topbar">
  <div class="topbar__in">
    <button class="brand" id="btnBrand">doozy</button>
    <nav class="tabs" id="tabs" role="tablist" data-i18n-title="tabs.aria" aria-label="Planning horizon"></nav>
    <div class="tools">
      <button class="btn" id="btnFile" hidden></button>
      <button class="btn" id="btnExport" data-i18n="export" data-i18n-title="export.title">Export</button>
      <button class="btn" id="btnImport" data-i18n="import" data-i18n-title="import.title">Import</button>
      <select class="select" id="langSelect" title="Interface language" aria-label="Interface language"></select>
      <button class="btn btn--icon" id="btnSettings" title="Show or hide horizons" aria-pressed="false">⚙</button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden />
    </div>
  </div>
</header>

<div class="wrap">
  <noscript><p class="boot-error">Doozy needs JavaScript — it is turned off in this browser.<br />
    Doozy не работает без JavaScript — в этом браузере он выключен.</p></noscript>
  <p class="boot-error" id="bootError" hidden></p>
  <div class="periodbar">
    <button class="nav-btn" id="btnPrev" data-i18n-title="nav.prev" aria-label="Previous period"></button>
    <button class="nav-btn" id="btnNext" data-i18n-title="nav.next" aria-label="Next period"></button>
    <h1 class="period-title" id="periodTitle"></h1>
    <select class="select" id="spanSelect" data-i18n-title="nav.span" aria-label="How many periods to show"></select>
    <button class="btn" id="btnNow" data-i18n="nav.today" data-i18n-title="nav.todayTitle">Today</button>
  </div>

  <div class="settings" id="settings" hidden></div>
  <div class="filters" id="filters" hidden></div>

  <main id="content"></main>

  <p class="foot" data-i18n="footer"></p>
</div>

<!-- ?v= — версия сборки: менять при каждом деплое, иначе браузер может взять новый HTML
     и старый JS из кэша (GitHub Pages кэширует на 10 минут) -->
<script src="js/i18n.js?v=2026-09-06"></script>
<script src="js/store.js?v=2026-09-06"></script>
<script src="js/insights.js?v=2026-09-06"></script>
<script src="js/filesync.js?v=2026-09-06"></script>
<script src="js/ui.js?v=2026-09-06"></script>
<script src="js/app.js?v=2026-09-06"></script>
</body>
</html>
